name: Lint Markdown

# No base-branch filter on pull_request: a PR stacked on another branch would otherwise get no lint at all and read as verified.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test tracked Markdown input selection
        run: python3 .claude/scripts/test-markdownlint-inputs.py

      - name: Select tracked Markdown literal inputs
        id: inputs
        run: python3 .claude/scripts/markdownlint-inputs.py --github-output "$GITHUB_OUTPUT"

      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          config: ".markdownlint.yaml"
          globs: ${{ steps.inputs.outputs.globs }}
